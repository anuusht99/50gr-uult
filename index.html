<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>50гр-ын уулт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: Fright Night poster world — violet dusk sky, pink moon low on the horizon, silhouetted graveyard at the foot; glass panels float above it. One deliberate night look. */
:root{
  --sky-1:#22114c; --sky-2:#3b2284; --sky-3:#6a3fae; --dusk:#a35bb8;
  --rose:#f2a7b4; --coral:#ec6f78; --moon:#fbe3e6; --shade:#1a0c3e;
  --glass:rgba(26,12,62,.74); --glass-2:rgba(64,36,128,.55); --line:rgba(255,255,255,.16);
  --white:#ffffff; --muted:#cdbfe8; --lime:#c6ef3a;
  --amber:#f7b733; --foam:#fff7e0; --good:#62f0a4; --bad:#ff6b7a;
  --g-moon:linear-gradient(180deg,#ffffff 0%,#fbe3e6 50%,#f39aa5 100%);
  --g-coral:linear-gradient(135deg,#f58a8f,#c4467f);
  --f:"Montserrat",Arial,"Helvetica Neue",sans-serif;
  color-scheme:dark;
}
html{font-size:clamp(14px, .5vw + 9px, 22px)}
body{
  color:var(--white);font-family:var(--f);line-height:1.45;min-height:100vh;background-color:var(--sky-1);
  background:
    radial-gradient(1.5px 1.5px at 12% 14%, #fff, transparent 70%),
    radial-gradient(1px 1px at 33% 8%, #fff, transparent 70%),
    radial-gradient(1.5px 1.5px at 58% 18%, #fff, transparent 70%),
    radial-gradient(1px 1px at 76% 11%, #fff, transparent 70%),
    radial-gradient(1px 1px at 90% 26%, #fff, transparent 70%),
    radial-gradient(1px 1px at 22% 34%, #fff, transparent 70%),
    radial-gradient(circle at 50% 80%, rgba(236,111,120,.85) 0 7vmax, rgba(242,167,180,.45) 13vmax, rgba(163,91,184,.25) 24vmax, transparent 40vmax),
    linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 38%,var(--sky-3) 72%,#4b2c92 100%);
  background-attachment:fixed;
}
.scenery{position:fixed;left:0;right:0;bottom:0;height:26vh;min-height:150px;z-index:0;pointer-events:none}
.scenery svg{width:100%;height:100%;display:block}
.bats{position:fixed;inset:0 0 auto;height:40vh;z-index:0;pointer-events:none;opacity:.8}
.bats svg{width:100%;height:100%}
#app,#modal{position:relative;z-index:1}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 20px;max-width:1800px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--rose)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--lime);outline-offset:2px}
h1,h2,.display{font-family:var(--f);font-weight:700;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
.gold{background:var(--g-moon);-webkit-background-clip:text;background-clip:text;color:transparent}
.title{font-size:1.9rem;line-height:1;letter-spacing:-.01em}
.muted{color:var(--muted)}
.btn{background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:.5em 1.1em;font-weight:700;transition:border-color .15s,transform .15s,background .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--rose)}
.btn.primary{background:var(--g-coral);border:0;color:#fff;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 10px 28px -12px var(--coral)}
.btn.primary:hover{transform:translateY(-1px)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.on{background:var(--white);color:var(--sky-2);border-color:var(--white)}
.btn.small{padding:.32em .8em;font-size:.85rem}
.btn.warn{color:var(--bad);border-color:var(--bad)}

/* ---------- role screen ---------- */
.hero{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(18px,4vw,48px);align-items:center;max-width:1180px;width:100%;margin:0 auto;padding-block:1vh;min-height:calc(100vh - 52px);box-sizing:border-box;align-content:center}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.poster{width:100%;max-width:420px;border-radius:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.7),0 0 0 1px var(--line);display:block;margin:0 auto}
.hero .side{display:flex;flex-direction:column;gap:18px}
.hero .kicker{font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);font-weight:700}
.ltitle{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:end;column-gap:0;line-height:.85;text-transform:none;letter-spacing:0;justify-content:start}
.ltitle .n{grid-row:1 / 3;font-size:clamp(6rem,16vw,12.5rem);font-weight:900;letter-spacing:-.02em;line-height:1;padding:.06em .1em .04em .02em;background:var(--g-moon);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(236,111,120,.45));overflow:visible}
.ltitle .u{align-self:end;margin-left:-.15em;font-size:clamp(1rem,2.4vw,1.8rem);font-weight:600;letter-spacing:.32em;color:var(--rose);text-transform:uppercase;padding-bottom:0;margin-bottom:-.5em;position:relative;top:.55em}
.ltitle .w{align-self:start;font-size:clamp(3rem,8vw,6.2rem);font-weight:900;letter-spacing:-.02em;text-transform:uppercase;color:#fff;text-shadow:0 4px 30px rgba(155,100,255,.55)}
.lrule{display:flex;align-items:center;gap:12px;max-width:420px}
.lrule::before,.lrule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rose),transparent)}
.lrule span{display:flex;gap:2px} .lrule svg{width:20px;height:20px}
.hero p.lead{font-size:1.15rem;color:var(--white);font-weight:500;max-width:40ch}
.ltitle .w{display:inline-flex;align-items:center;gap:.06em}
.ltitle .t{grid-column:2;grid-row:3;align-self:start;justify-self:start;margin-top:.2em;padding-left:.15em;font-size:clamp(.62rem,1.15vw,.95rem);font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:var(--rose);line-height:1.2}
.bigbeer{flex:none;width:clamp(110px,16vw,220px);height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.45));}
@keyframes offer{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-8px) rotate(-3deg)}}
.hero p{max-width:52ch;color:var(--muted);margin:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.ticket{position:relative;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) 64px;border:0;padding:0;border-radius:16px;color:var(--white);background:var(--tg);
  -webkit-mask:radial-gradient(circle at 0 50%,transparent 12px,#000 13px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%,transparent 12px,#000 13px) right/51% 100% no-repeat;
          mask:radial-gradient(circle at 0 50%,transparent 12px,#000 13px) left/51% 100% no-repeat, radial-gradient(circle at 100% 50%,transparent 12px,#000 13px) right/51% 100% no-repeat;
  transition:transform .2s, filter .2s}
.ticket:hover{transform:translateY(-4px);filter:brightness(1.08)}
.ticket .main{padding:22px 18px 22px 26px;display:flex;flex-direction:column;gap:6px}
.ticket .main small{letter-spacing:.3em;text-transform:uppercase;font-size:.7rem;font-weight:700;opacity:.85}
.ticket .main b{font-size:2.1rem;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.ticket .main span{color:rgba(255,255,255,.85);font-size:.92rem}
.ticket .stub{display:grid;place-items:center;border-left:2px dashed rgba(255,255,255,.45);background:rgba(0,0,0,.18)}
.ticket .stub i{font-style:normal;writing-mode:vertical-rl;letter-spacing:.3em;text-transform:uppercase;font-size:.75rem;font-weight:700}
.ticket.host{--tg:var(--g-coral)}
.ticket.player{--tg:linear-gradient(135deg,#9a7bff,#4a2b9e)}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:.28em .85em;font-weight:700}
.chip.live{color:var(--lime);border-color:color-mix(in srgb,var(--lime) 50%,transparent)}
.chip.off{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- turn ---------- */
.turn{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;border-radius:18px;padding:.9rem 1.3rem;
  background:linear-gradient(90deg,rgba(236,111,120,.42),rgba(26,12,62,.7) 65%);border:1px solid var(--line);backdrop-filter:blur(6px)}
.turn .now{font-size:.8rem;text-transform:uppercase;letter-spacing:.24em;color:var(--rose);font-weight:700}
.turn .who{font-weight:700;font-size:2.3rem;line-height:1.05;text-transform:uppercase}
.turn .next{margin-left:auto;color:var(--muted)}

/* ---------- board ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1000px){.stage{grid-template-columns:minmax(0,1fr)}}
.board-wrap{overflow-x:auto;min-width:0;padding-bottom:4px}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(96px,1fr));gap:9px;min-width:calc(var(--cols) * 104px)}
.cat{background:rgba(22,10,54,.82);border:1px solid var(--line);border-bottom:3px solid var(--c1);border-radius:12px;padding:.8em .55em;color:#fff;font-weight:700;font-size:.76rem;letter-spacing:.08em;line-height:1.25;text-transform:uppercase;min-height:4.6em;display:flex;align-items:center;justify-content:center;text-align:center;text-wrap:balance}
.tile{position:relative;border:1px solid var(--line);border-radius:12px;min-height:6.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:.5em;background:rgba(30,14,72,.74);backdrop-filter:blur(4px);transition:transform .15s, border-color .15s, background .15s}
.tile:not(.used):hover{transform:translateY(-2px);border-color:var(--c1);background:rgba(48,24,108,.85)}
.tile .val{font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
.tile .mugs{display:flex;gap:1px;opacity:.9}
.tile .mugs svg{width:12px;height:12px}
.tile .tag{position:absolute;top:7px;left:0;right:0;text-align:center;font-size:.56rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.tile.used{background:rgba(22,10,54,.35);border-style:dashed;cursor:default;backdrop-filter:none}
.tile.used .by{font-size:.8rem;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.tile.used .pts{font-weight:700;font-size:1.4rem}
.tile.used .pts.zero{color:var(--bad)} .tile.used .pts.plus{color:var(--good)}
.editing .tile{cursor:pointer;outline:2px dashed var(--lime);outline-offset:-6px}
.ro .tile{cursor:default}

/* ---------- scores ---------- */
.scores{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;padding:1rem;display:flex;flex-direction:column;gap:6px}
.scores h2{font-size:1.2rem;letter-spacing:.14em}
.row{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;align-items:center;gap:8px;padding:.5em .6em;border-radius:10px;border:1px solid transparent}
.row.cur{border-color:var(--rose);background:linear-gradient(90deg,rgba(236,111,120,.3),transparent)}
.row .rk{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.row .nm{font-weight:700;overflow-wrap:anywhere;min-width:0}
.row .nm small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.row .nm input{padding:.35em .5em;font-weight:700}
.row .sc{font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.row .adj{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
.row.out{opacity:.45}
.row.lead .sc{background:var(--g-moon);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:6px}

/* ---------- panels ---------- */
.panel{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,3vw,32px);display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:1.5rem;letter-spacing:.08em}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input[type=text],input[type=url],textarea,select{background:rgba(18,8,44,.85);border:1px solid var(--line);border-radius:10px;color:var(--white);font:inherit;padding:.55em .7em;width:100%;box-sizing:border-box}
textarea{min-height:4.5em;resize:vertical}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plan div{background:rgba(18,8,44,.6);border:1px solid var(--line);border-radius:14px;padding:.9em 1em;display:flex;flex-direction:column;gap:2px}
.plan b{font-size:1.35rem;font-variant-numeric:tabular-nums}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:76ch}
.note{border-left:3px solid var(--lime);padding:.4em .9em;color:var(--muted);margin:0}

/* ---------- question card ---------- */
.overlay{position:fixed;inset:0;z-index:50;overflow-y:auto;display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 100%, rgba(236,111,120,.45), transparent 55%), linear-gradient(180deg,rgba(24,11,58,.95),rgba(48,26,110,.96));
  backdrop-filter:blur(6px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-top:calc(16px + env(safe-area-inset-top, 0px));padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}
.dlg{max-width:1280px;width:100%;box-sizing:border-box;margin:auto;border-radius:22px;padding:clamp(14px,2.2vw,30px);display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px);
  background:linear-gradient(90deg,var(--c1),var(--c2)) top/100% 6px no-repeat, linear-gradient(180deg,rgba(40,20,92,.92),rgba(20,9,50,.95));border:1px solid var(--line);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.qhead{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.qhead .meta{display:inline-flex;gap:8px;align-items:center;font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2));padding:.35em .95em;border-radius:999px}
.qhead .team{font-weight:700;font-size:2rem;text-transform:uppercase}
.qhead .beers{display:flex;gap:2px}
.qhead .beers svg{width:30px;height:30px}
.qbody{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center}
.qbody.has-vis{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:820px){.qbody.has-vis{grid-template-columns:minmax(0,1fr)}}
.qtext{font-size:clamp(1.3rem,min(2.4vw,4vh),2.5rem);font-weight:700;line-height:1.22;text-wrap:balance;margin:0}
.vis{border-radius:16px;overflow:hidden;display:grid;place-items:center;min-height:140px;position:relative;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 95%, rgba(236,111,120,.8) 0 18%, rgba(242,167,180,.35) 32%, transparent 60%), linear-gradient(180deg,var(--sky-1),var(--sky-3))}
.vis img,.vis video{display:block;width:100%;max-height:36vh;object-fit:contain;background:#0b0520}
.vis .emo{font-size:clamp(2.4rem,min(7vw,10vh),6rem);line-height:1.1;letter-spacing:.06em;text-align:center;padding:18px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));overflow-wrap:anywhere}
.vis .lbl{position:absolute;left:12px;top:10px;z-index:2;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#fff;background:rgba(26,12,62,.6);padding:.25em .75em;border-radius:999px}
.vislink{display:flex;justify-content:flex-end}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.answers{grid-template-columns:minmax(0,1fr)}}
.ans{background:linear-gradient(160deg,rgba(70,40,140,.6),rgba(20,9,50,.8));border:2px solid var(--line);border-radius:16px;padding:1rem;display:flex;flex-direction:column;gap:12px;transition:border-color .35s,background .35s,opacity .35s}
.ans .lt{display:flex;gap:12px;align-items:flex-start}
.ans .letter{flex:none;width:2.1em;height:2.1em;border-radius:50%;background:var(--g-coral);display:grid;place-items:center;font-weight:700;color:#fff}
.ans .txt{font-size:1.25rem;font-weight:700;min-width:0;overflow-wrap:anywhere}
.ans .stack{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;align-items:center}
.ans .stack svg{width:34px;height:34px;transition:transform .6s,opacity .6s}
.ans .stack .empty{font-size:.85rem;color:var(--muted);font-style:italic}
.ans .ctl{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.ans .ctl .n{font-weight:700;font-size:1.5rem;min-width:1.5ch;text-align:center;font-variant-numeric:tabular-nums}
.step{width:2.5rem;height:2.5rem;border-radius:50%;background:var(--glass-2);border:1px solid var(--line);font-weight:700;font-size:1.2rem}
.step:disabled{opacity:.3;cursor:not-allowed}
.ans.ok{border-color:var(--good);background:linear-gradient(160deg,rgba(98,240,164,.32),rgba(20,9,50,.8))}
.ans.no{border-color:color-mix(in srgb,var(--bad) 55%,transparent);opacity:.6}
.ans.no .stack svg{transform:translateY(16px) rotate(80deg);opacity:.12}
.qfoot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.count{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.count .of{color:var(--muted);font-weight:400}
.hint{color:var(--muted)} .hint.okk{color:var(--good)}
.result{font-weight:700;text-transform:uppercase;font-size:clamp(1.6rem,min(3.4vw,5vh),3rem);text-align:center;line-height:1.1}
.result.win{color:var(--good)} .result.lose{color:var(--bad)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.winner{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.winner .crown{font-weight:700;text-transform:uppercase;font-size:clamp(2.8rem,8vw,6.5rem);line-height:1}
.edit-ans{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.media-edit{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.media-edit img,.media-edit video{width:130px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#000}
.wait{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8vh 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- visual rules ---------- */
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.g{margin:0;background:rgba(18,8,44,.6);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.g figcaption{font-size:.9rem;color:var(--muted)} .g figcaption b{color:var(--white);display:block;margin-bottom:3px}
.gbox{display:grid;gap:6px} .gbox.four{grid-template-columns:repeat(2,minmax(0,1fr))} .gbox.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.ga{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:44px;display:flex;flex-direction:column;gap:4px;background:rgba(70,40,140,.45)}
.gl{font-size:.7rem;font-weight:700;color:var(--rose)}
.gm{display:flex;flex-wrap:wrap;gap:1px} .gm svg{width:15px;height:15px}
.ge{font-size:.7rem;color:var(--muted);font-style:italic}
.ga.must{border:2px dashed var(--lime)} .ga.must .ge{color:var(--lime);font-style:normal;font-weight:700}
.ga.all{border-color:var(--rose)}
.ga.win{border:2px solid var(--good);background:rgba(98,240,164,.18)}
.ga.lose{opacity:.4}
.gp{position:absolute;right:8px;top:6px;font-weight:700;color:var(--good)}
.gvals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gv{border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(70,40,140,.45)}

/* ================= persistence ================= */
const W={busy:false,dirty:new Set(),t:0};
function persist(...keys){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!(DB&&CAN_SYNC&&ROLE==='host')) return;
  (keys.length?keys:['state']).forEach(k=>W.dirty.add(k));
  clearTimeout(W.t); W.t=setTimeout(flush,180);
}
async function flush(){
  if(W.busy) return; W.busy=true;
  try{
    while(W.dirty.size){
      const k=[...W.dirty][0]; W.dirty.delete(k);
      const path=k==='state'?'game/state':'qs/'+k;
      const data=k==='state'
        ?clone({phase:S.phase,teams:S.teams,finalCount:S.finalCount,finalists:S.finalists,ptr:S.ptr,used:S.used,live:S.live})
        :{v:4,cats:clone(S.questions[k])};
      try{await DB.doc(path).set(data); if(syncErr){syncErr='';render()}}
      catch(e){syncErr=(e&&e.message)||'Хадгалж чадсангүй'; render()}
    }
  }finally{W.busy=false}
}

function render(){
  const app=document.getElementById('app');
  if(!entered){app.innerHTML=roleHTML();renderModal();return}
  const G=view();
  app.classList.toggle('editing',ROLE==='host'&&editing);
  app.classList.toggle('ro',ROLE==='player');
  if(!G){app.innerHTML=playerWaitHTML();renderModal();return}
  let h=headerHTML(G);
  if(showRules&&G.phase!=='setup') h+=`<section class="panel">${rulesHTML(G)}</section>`;
  if(G.phase==='setup') h+= ROLE==='host'?setupHTML(G):`<section class="panel wait"><h2 class="gold">Хөтлөгч тоглоомыг бэлдэж байна</h2><p class="muted">Эхлэхэд самбар энд автоматаар гарч ирнэ.</p></section><section class="panel">${rulesHTML(G)}</section>`;
  else if(G.phase==='main'||G.phase==='final'){
    h+=`<div class="turn"><span class="now">Одоо гарах баг</span><span class="who gold">${esc(G.teams[cur(G)].name)}</span>
      <span class="next">Дараа нь: ${esc(G.teams[nxt(G)].name)}</span></div>`;
    if(ROLE==='host'&&editing) h+=`<p class="note">Засварлах горим: нүд дээр дарж асуулт, зураг, киноны хэсгээ солино. Онооны самбараас багийн нэр, оноог засах, ээлж өгөх боломжтой.</p>`;
    h+=`<div class="stage">${boardHTML(G)}${scoresHTML(G)}</div>`;
  } else if(G.phase==='qualify') h+=qualifyHTML(G);
  else h+=doneHTML(G);
  app.innerHTML=h;
  startIdle();
  renderModal();
}

  let body='';

let spinning=false, justHit=false;
const CELL=72;
function drawnList(G){
  const n=G.teams.length;
  if(G.order&&G.order.length===n) return G.order;
  return (G.drawn||[]).filter(i=>i<n);
}

const SYM=['7','🍒','🔔','BAR','💎','🍋','⭐'];
const symHTML=x=>x==='7'?'<span class="s7">7</span>':x==='BAR'?'<span class="bar">BAR</span>':x;
function reelHTML(G,d,done,show){
  const idle=!spinning&&!done&&!justHit&&G.teams.length>1;
  const side=id=>idle
    ?`<div class="reel side"><div class="strip idle" id="${id}" data-dist="${-SYM.length*CELL}" data-dur="${id==='stripL'?2.2:2.7}" style="transform:translateY(${CELL}px)">${[...SYM,...SYM,...SYM].map(x=>`<div class="cell">${symHTML(x)}</div>`).join('')}</div></div>`
    :`<div class="reel side"><div class="strip" id="${id}" style="transform:translateY(0px)">${['🍒','7','🔔'].map(x=>`<div class="cell">${symHTML(x)}</div>`).join('')}</div></div>`;
  let mid;
  if(idle){
    const rem=G.teams.map((_,i)=>i).filter(i=>!d.includes(i)), pool=(rem.length>1?rem:G.teams.map((_,i)=>i)).map(i=>G.teams[i].name);
    const loop=[...pool,...pool,...pool];
    mid=`<div class="reel" id="reel"><div class="strip idle" id="strip" data-dist="${-pool.length*CELL}" data-dur="${Math.max(2.4,pool.length*.55)}" style="transform:translateY(${CELL}px)">${loop.map(x=>`<div class="cell">${esc(x)}</div>`).join('')}</div></div>`;
  } else mid=`<div class="reel" id="reel"><div class="strip" id="strip" style="transform:translateY(${CELL}px)"><div class="cell">${esc(show)}</div></div></div>`;
  return `<div class="reels one">${mid}</div>`;
}
function paintOrder(){const el=document.getElementById('orderbox'); if(el){el.innerHTML=orderHTML(S); startIdle()}}
function startIdle(){
  document.querySelectorAll('.strip.idle').forEach(st=>{
    if(!st.animate) return;
    const dist=+st.dataset.dist, dur=+st.dataset.dur*1000;
    st.animate([{transform:`translateY(${CELL}px)`},{transform:`translateY(${CELL+dist}px)`}],{duration:dur,iterations:Infinity,easing:'linear'});
  });
  const bulbs=[...document.querySelectorAll('.bulbrow i')];
  bulbs.forEach((b,k)=>b.animate&&b.animate([{opacity:1},{opacity:.25},{opacity:1}],{duration:justHit?320:1100,delay:(k%18)*(justHit?20:70),iterations:Infinity}));
  if(justHit){const w=document.querySelector('.window'); if(w&&w.animate) w.animate([{boxShadow:'0 0 0 0 rgba(198,239,58,0)'},{boxShadow:'0 0 28px 8px rgba(198,239,58,.85)'},{boxShadow:'0 0 0 0 rgba(198,239,58,0)'}],{duration:500,iterations:4})}
}
function pullLever(){
  const arm=document.querySelector('.lever .arm'), knob=document.querySelector('.lever .knob');
  if(!arm||!arm.animate) return;
  const o={duration:1150,easing:'ease-in-out'};
  arm.animate([{transform:'rotateX(0deg)'},{transform:'rotateX(-80deg)',offset:.38},{transform:'rotateX(-80deg)',offset:.55},{transform:'rotateX(10deg)',offset:.8},{transform:'rotateX(0deg)'}],o);
  knob.animate([{transform:'rotateX(0deg) scale(1)'},{transform:'rotateX(80deg) scale(1.45)',offset:.38},{transform:'rotateX(80deg) scale(1.45)',offset:.55},{transform:'rotateX(-10deg) scale(.95)',offset:.8},{transform:'rotateX(0deg) scale(1)'}],o);
}
function spin(){
  if(spinning) return;
  const n=S.teams.length, d=drawnList(S).slice(); if(d.length>=n) return;
  const rem=S.teams.map((_,i)=>i).filter(i=>!d.includes(i));
  const target=rem[Math.floor(Math.random()*rem.length)];
  spinning=true; justHit=false; paintOrder();
  let ended=false;
  const finish=()=>{ if(ended) return; ended=true;
    d.push(target); S.drawn=d; if(d.length===n) S.order=d.slice(); S.ptr=0;
    spinning=false; justHit=true; persist(); paintOrder(); setTimeout(()=>{justHit=false; if(!spinning) paintOrder()},2400); };
  pullLever();
  const strip=document.getElementById('strip');
  if(!strip||!strip.animate){finish();return}
  const roll=(el,items,html,dur,delay,blur)=>{
    el.innerHTML=items.map(x=>`<div class="cell">${html(x)}</div>`).join('');
    const stop=items.length-2;
    return el.animate([
      {transform:`translateY(${CELL}px)`,filter:`blur(${blur}px)`},
      {filter:`blur(${blur*.7}px)`,offset:.6},
      {transform:`translateY(${CELL-stop*CELL}px)`,filter:'blur(0px)'}
    ],{duration:dur,delay,easing:'cubic-bezier(.12,.8,.2,1.04)',fill:'forwards'});
  };
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  const sideSeq=k=>{const a=[rnd(SYM)]; for(let i=0;i<k;i++) a.push(rnd(SYM)); a.push('7'); a.push(rnd(SYM)); return a};
  ['stripL','stripR'].forEach((id,k)=>{const el=document.getElementById(id); if(el&&el.animate) roll(el,sideSeq(16+k*6),symHTML,2200+k*600,300+k*80,2)});
  const prevName=d.length?S.teams[d[d.length-1]].name:'LUCKY 777';
  const seq=[prevName]; for(let k=0;k<26+Math.floor(Math.random()*6);k++) seq.push(S.teams[Math.floor(Math.random()*n)].name);
  seq.push(S.teams[target].name); seq.push(S.teams[Math.floor(Math.random()*n)].name);
  const a=roll(strip,seq,esc,3500,420,3);
  a.onfinish=finish;
  setTimeout(finish,4500);
}

  let h=`<div class="board-wrap"><div class="board" style="--cols:${cats.length}">`;
  cats.forEach((c,ci)=>h+=`<div class="cat" style="${gv(ci)}">${esc(c.name)}</div>`);
  VALUES.forEach(v=>cats.forEach((c,ci)=>{
    const u=(G.used[r]||{})[ci+'-'+v], it=c.qs[v]||{};

function check(L){
  const sum=L.alloc.reduce((a,b)=>a+b,0), empty=L.alloc.filter(x=>x===0).length;
  if(sum<L.v) return {ok:false,msg:`Дахиад ${L.v-sum} шар айраг тавина.`};
  if(empty<1) return {ok:false,msg:'Нэг хариулт хоосон байх ёстой.'};
  return {ok:true,msg:'Бүгд байрлалаа. Түгжинэ үү.'};
}
function canInc(L,i){
  const sum=L.alloc.reduce((a,b)=>a+b,0), empty=L.alloc.filter(x=>x===0).length;
  return sum<L.v && !(L.alloc[i]===0&&empty<=1);
}
/* ---- local media store (IndexedDB) for big video/audio files ---- */
const MEDIA_URLS={};
function mediaDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('hw-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function mediaPut(blob){
  const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), db=await mediaDB();
  await new Promise((res,rej)=>{const tx=db.transaction('m','readwrite');tx.objectStore('m').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('Хадгалах зай хүрэлцсэнгүй'))});
  MEDIA_URLS['idb:'+id]=URL.createObjectURL(blob);
  return 'idb:'+id;
}
async function mediaDel(ref){
  if(!ref||!ref.startsWith('idb:')) return;
  try{const db=await mediaDB(); db.transaction('m','readwrite').objectStore('m').delete(ref.slice(4))}catch(e){}
  if(MEDIA_URLS[ref]){URL.revokeObjectURL(MEDIA_URLS[ref]);delete MEDIA_URLS[ref]}
}
async function mediaUrl(ref){
  if(!ref||!ref.startsWith('idb:')) return ref;
  if(MEDIA_URLS[ref]) return MEDIA_URLS[ref];
  const db=await mediaDB();
  const blob=await new Promise((res,rej)=>{const r=db.transaction('m').objectStore('m').get(ref.slice(4));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  if(!blob) return null;
  return MEDIA_URLS[ref]=URL.createObjectURL(blob);
}
const msrc=ref=>ref&&ref.startsWith('idb:')?(MEDIA_URLS[ref]||''):(ref||'');
function hydrateMedia(root){
  (root||document).querySelectorAll('[data-media]').forEach(async el=>{
    if(el.getAttribute('src')) return;
    try{const u=await mediaUrl(el.dataset.media); if(u) el.src=u; else el.replaceWith(Object.assign(document.createElement('span'),{className:'muted',textContent:'Энэ файл энэ төхөөрөмж дээр олдсонгүй. Асуулт засварлах хэсгээс дахин оруулна уу.'}))}catch(e){}
  });
}

   ${link?`<div class="vislink"><a class="btn small" href="${esc(link)}" target="_blank" rel="noopener">Киноны хэсгийг нээх ↗</a></div>`:''}
   <div class="answers a${n}">`;
  it.a.slice(0,n).forEach((a,i)=>{
    const cls=rev?(i===it.c?'ok':'no'):'';
    h+=`<div class="ans ${cls}"><div class="lt"><span class="letter">${LET[i]}</span><span class="txt">${esc(a)}</span></div>
     <div class="stack">${L.alloc[i]?mugs(L.alloc[i]):'<span class="empty">хоосон</span>'}</div>`;
    if(host&&L.stage==='place') h+=`<div class="ctl"><button class="step" data-act="dec" data-i="${i}" ${L.alloc[i]?'':'disabled'} aria-label="Хасах">−</button><span class="n">${L.alloc[i]}</span><button class="step" data-act="inc" data-i="${i}" ${canInc(L,i)?'':'disabled'} aria-label="Нэмэх">+</button>
      ${L.v===5?`<button class="btn small" data-act="all" data-i="${i}">Бүгдийг энд</button>`:''}</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  if(rev){const p=L.alloc[it.c], d=L.v-p; h+=`<div class="resrow"><div class="result ${p?'win':'lose'}">${p?`${esc(t.name)} баг оноо авлаа! +${p}`:`${esc(t.name)} баг оноо авсангүй`}</div>${d?`<div class="drink">${mugs(d)}<span>Буруу хариулт дээрх ${d} шар айргийг ууна!</span></div>`:''}</div>`;}
  h+=`<div class="qfoot">`;
  if(L.stage==='place') h+= host
    ?`<span class="count">${sum} <span class="of">/ ${L.v} шар айраг</span></span><span class="hint ${chk.ok?'okk':''}">${chk.msg}</span>
      <div class="acts"><button class="btn" data-act="cancel">Буцах</button><button class="btn primary" data-act="lock" ${chk.ok?'':'disabled'}>Түгжих</button></div>`
    :`<span class="count">${sum} <span class="of">/ ${L.v} шар айраг тавьсан</span></span><span class="hint">Баг шар айргаа байрлуулж байна…</span>`;
  else if(L.stage==='locked') h+= host
    ?`<span class="hint">Байрлал түгжигдлээ. Бэлэн болмогц хариуг нээнэ.</span><div class="acts"><button class="btn" data-act="unlock">Засах</button><button class="btn primary" data-act="reveal">Хариу нээх</button></div>`
    :`<span class="hint">Байрлал түгжигдлээ. Хариуг удахгүй нээнэ…</span>`;
  else h+=`<span class="hint">Зөв хариулт: ${LET[it.c]}. ${esc(it.a[it.c])}${it.expl?`<br><small>${esc(it.expl)}</small>`:''}</span>${host?'<div class="acts"><button class="btn primary" data-act="commit">Үргэлжлүүлэх</button></div>':''}`;
  h+=`</div></div></div>`;
  const oldVis=root.querySelector('.vis[data-key]');
  root.innerHTML=h;
  const newVis=root.querySelector('.vis[data-key]');
  if(oldVis&&newVis&&oldVis.dataset.key===newVis.dataset.key) newVis.replaceWith(oldVis); else hydrateMedia(root);
}
function openQ(ci,v){
  const r=round(S);
  S.live={r,ci,v,team:cur(S),alloc:Array(nAns(v)).fill(0),stage:'place'};
  persist(); render();
}
function commit(){
  const L=S.live, it=S.questions[L.r][L.ci].qs[L.v], pts=L.alloc[it.c];
  S.used[L.r][L.ci+'-'+L.v]={team:L.team,pts};
  S.teams[L.team][L.r]+=pts;
  S.ptr=(S.ptr+1)%order(S).length;
  S.live=null;
  if(L.r==='main'&&usedN(S,'main')>=totalQ(S,'main')){
    const t=leadersOf(S,S.teams.map((_,i)=>i),'main');
    if(t.length===1){S.winner=t[0];S.finalists=[];S.phase='done'}
    else{S.winner=null;S.finalists=t;S.phase='qualify'}
  } else if(L.r==='final'){
    const k=S.finalists.length, n=usedN(S,'final');
    if(n%k===0){
      const lead=leadersOf(S,S.finalists,'final');
      if(lead.length===1){S.winner=lead[0];S.phase='done'}
      else if(totalQ(S,'final')-n<k){S.winner=null;S.phase='done'}
    }
  }
  persist(); render();
}

/* ================= editor ================= */
function openEdit(ci,v){const r=round(S);const c=S.questions[r][ci];E={r,ci,v,name:c.name,icon:c.icon||'',...clone(c.qs[v]),busy:false,msg:''};render()}
function readEditor(){
  if(!E) return; const g=id=>document.getElementById(id);
  if(g('e-name')) E.name=g('e-name').value; if(g('e-icon')) E.icon=g('e-icon').value;
  if(g('e-q')) E.q=g('e-q').value; if(g('e-pic')) E.pic=g('e-pic').value; if(g('e-link')) E.link=g('e-link').value; if(g('e-note')) E.note=g('e-note').value; if(g('e-expl')) E.expl=g('e-expl').value;
  E.a=Array.from({length:nAns(E.v)},(_,i)=>g('e-a'+i)?g('e-a'+i).value:(E.a[i]||''));
  const sel=document.querySelector('input[name="e-c"]:checked'); if(sel) E.c=+sel.value;
}
function editorHTML(){
  const n=nAns(E.v), canUp=!!(ASSETS&&CAN_SYNC);
  const search='https://www.youtube.com/results?search_query='+encodeURIComponent((E.a[E.c]||E.q)+' scene');
  return `<div class="overlay" role="dialog" aria-modal="true" style="${gv(E.ci)}"><div class="dlg" style="max-width:840px">
   <div class="qhead"><span class="meta">Асуулт засах · ${E.v} оноо · ${n} хариулт</span></div>
   <div style="display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px">
    <label class="f">Ангиллын нэр<input type="text" id="e-name" value="${esc(E.name)}"></label>
    <label class="f">Тэмдэг<input type="text" id="e-icon" value="${esc(E.icon)}"></label></div>
   <label class="f">Асуулт<textarea id="e-q">${esc(E.q)}</textarea></label>
   <div class="f"><span>Видео (киноны хэсэг г.м · 1080p, 2 минут хүртэл · ${MAX_MEDIA_MB} МБ хүртэл)</span>
    <div class="media-edit">${E.vid?`<video data-media="${esc(E.vid)}" src="${esc(msrc(E.vid))}" muted preload="metadata"></video>`:''}
     <label class="btn small" style="cursor:pointer">${E.vid?'Видео солих':'Видео оруулах'}<input type="file" id="e-vfile" accept="video/*" hidden></label>
     ${E.vid?'<button class="btn small warn" data-act="evdel">Видео хасах</button>':''}</div></div>
   <div class="f"><span>Аудио (дууны хэсэг г.м · mp3, m4a, wav)</span>
    <div class="media-edit">${E.aud?`<audio data-media="${esc(E.aud)}" src="${esc(msrc(E.aud))}" controls preload="metadata"></audio>`:''}
     <label class="btn small" style="cursor:pointer">${E.aud?'Аудио солих':'Аудио оруулах'}<input type="file" id="e-afile" accept="audio/*" hidden></label>
     ${E.aud?'<button class="btn small warn" data-act="eadel">Аудио хасах</button>':''}</div></div>
   <p class="muted" style="margin:0;font-size:.8rem">Видео, аудио нь энэ компьютерийн хөтөч дээр хадгалагдана. Тоглоом явуулах компьютер дээрээ оруулаарай.</p>
   <div class="f"><span>Эсвэл зураг (кадр, дуучны зураг г.м)</span>
    <div class="media-edit">${E.img?`<img src="${esc(E.img)}" alt="Одоогийн зураг">`:''}
     <label class="btn small" style="cursor:pointer">${E.img?'Зураг солих':'Зураг оруулах'}<input type="file" id="e-file" accept="image/*" hidden></label>
     ${E.img?'<button class="btn small warn" data-act="eimgdel">Зураг хасах</button>':''}</div></div>
   <label class="f">Эсвэл киноны хэсгийн холбоос (шинэ цонхонд нээгдэнэ)<input type="url" id="e-link" value="${esc(E.link||'')}" placeholder="https://www.youtube.com/watch?v=…"></label>
   <div><a class="btn small" href="${esc(search)}" target="_blank" rel="noopener">YouTube-ээс хэсэг хайх ↗</a></div>
   <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
    <label class="f">Нэмэлт / Challenge (асуулт дээр харагдана)<input type="text" id="e-note" value="${esc(E.note||'')}" placeholder="жишээ нь Challenge: 1 shot tequila"></label>
    <label class="f">Тайлбар (хариу нээгдэхэд харагдана)<input type="text" id="e-expl" value="${esc(E.expl||'')}"></label></div>
   <label class="f">Эможи зураг (видео, зураг байхгүй үед харагдана)<input type="text" id="e-pic" value="${esc(E.pic||'')}" placeholder="жишээ нь 🦈🏖️🚤"></label>
   ${E.busy||E.msg?`<p class="note" role="status">${E.busy?'Файлыг хадгалж байна…':esc(E.msg)}</p>`:''}
   <div class="f" style="gap:8px"><span>Хариултууд (зөвийг нь сонгоно)</span>
   ${Array.from({length:n},(_,i)=>`<div class="edit-ans"><input type="radio" name="e-c" id="e-c${i}" value="${i}" ${E.c===i?'checked':''} aria-label="Зөв хариулт ${LET[i]}"><input type="text" id="e-a${i}" value="${esc(E.a[i]||'')}" placeholder="${LET[i]} хариулт"></div>`).join('')}</div>
   <div class="qfoot"><button class="btn small" data-act="edefault">Анхны асуултаар сэргээх</button>
   <div class="acts"><button class="btn" data-act="ecancel">Болих</button><button class="btn primary" data-act="esave" ${E.busy?'disabled':''}>Хадгалах</button></div></div>
  </div></div>`;

function saveEdit(){
  readEditor();
  const n=nAns(E.v), c=S.questions[E.r][E.ci];
  c.name=E.name.trim()||c.name; c.icon=E.icon.trim();
  const q={q:E.q.trim()||'—',a:Array.from({length:n},(_,i)=>(E.a[i]||'').trim()||'—'),c:E.c||0,pic:(E.pic||'').trim()};
  if(E.img) q.img=E.img; if(E.vid) q.vid=E.vid; if(E.aud) q.aud=E.aud; if((E.note||'').trim()) q.note=E.note.trim(); if((E.expl||'').trim()) q.expl=E.expl.trim();
  const lk=safeUrl((E.link||'').trim()); if(lk) q.link=lk;
  c.qs[E.v]=q; const r=E.r; E=null; persist(r); render();
}
function shrink(file,max,quality){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);cv.toBlob(b=>b?res({blob:b,data:()=>cv.toDataURL('image/jpeg',quality)}):rej(new Error('Зургийг уншиж чадсангүй')),'image/jpeg',quality)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Энэ файлыг зураг гэж уншиж чадсангүй'))};
    img.src=url;
  });
}
async function onImage(file){
  readEditor(); E.busy=true; E.msg=''; renderModal();
  try{
    if(ASSETS&&CAN_SYNC){const s=await shrink(file,1400,.85); const r=await ASSETS.upload(s.blob); E.img='/_blob/'+r.id; E.msg='Зураг нэмэгдлээ.';}
    else{const s=await shrink(file,560,.7); E.img=s.data(); E.msg='Зураг энэ төхөөрөмж дээр хадгалагдлаа.';}
  }catch(e){E.msg=(e&&e.message)||'Зураг оруулж чадсангүй. Өөр зураг сонгоно уу.'}
  if(E){E.busy=false; renderModal();}
}
const MAX_MEDIA_MB=600;
async function onMedia(file,kind){
  readEditor();
  if(file.size>MAX_MEDIA_MB*1024*1024){E.msg=`Файл ${Math.round(file.size/1048576)} МБ байна. ${MAX_MEDIA_MB} МБ-аас бага файл оруулна уу.`;renderModal();return}
  E.busy=true; E.msg=''; renderModal();
  try{
    try{await navigator.storage?.persist?.()}catch(e){}
    try{const est=await navigator.storage?.estimate?.(); if(est&&est.quota&&est.quota-est.usage<file.size*1.1) throw new Error('Энэ төхөөрөмж дээр хадгалах зай хүрэлцэхгүй байна. Хуучин видеогоо хасаад дахин оролдоно уу.')}catch(e){if(e.message&&e.message.startsWith('Энэ')) throw e}
    const ref=await mediaPut(file);
    const prev=E[kind]; E[kind]=ref; if(prev) mediaDel(prev);
    E.msg=(kind==='vid'?'Видео':'Аудио')+` нэмэгдлээ (${Math.round(file.size/1048576)} МБ).`;
  }catch(e){E.msg=(e&&e.message)||'Файлыг хадгалж чадсангүй. Өөр файл сонгоно уу.'}
  if(E){E.busy=false; renderModal();}
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, i=+b.dataset.i, host=ROLE==='host';
  if(a==='enter'){entered=true;render();return}
  if(a==='rules'){showRules=!showRules;render();return}
  if(!host) return;
  const L=S.live;
  switch(a){
    case 'start': if(spinning) break; S.phase='main'; S.ptr=0; persist(); render(); break;
    case 'spin': spin(); break;
    case 'home': if(!spinning){entered=false; qedit=false; editing=false; render(); window.scrollTo(0,0)} break;
    case 'qedit': qedit=true; editing=true; render(); window.scrollTo(0,0); break;
    case 'qeditdone': qedit=false; editing=false; setupStep=0; render(); break;
    case 'step': if(!spinning){setupStep=Math.max(0,Math.min(2,i)); render(); window.scrollTo(0,0)} break;
    case 'redraw': if(!spinning){S.drawn=[];S.order=null;persist();paintOrder()} break;
    case 'addteam': if(S.teams.length>=MAX_TEAMS) break; S.teams.push({name:'Баг '+(S.teams.length+1),main:0,final:0}); S.order=null; S.drawn=[]; persist(); render(); {const el=document.getElementById('tn'+(S.teams.length-1)); if(el){el.focus();el.select()}} break;
    case 'rmteam': if(S.teams.length>2){S.teams.splice(i,1); S.order=null; S.drawn=[]; if(S.finalCount>=S.teams.length) S.finalCount=1; persist(); render();} break;
    case 'editstart': if(spinning) break; S.phase='main'; S.ptr=0; editing=true; persist(); render(); break;
    case 'edit': editing=!editing; render(); break;
    case 'reset':
      if(resetArm){clearTimeout(resetArm);resetArm=0;S=fresh(S);picks=null;persist();render();}
      else{resetArm=setTimeout(()=>{resetArm=0;render()},3000);render();}
      break;
    case 'tile': { const ci=+b.dataset.ci, v=+b.dataset.v;
      if(editing) openEdit(ci,v); else if(!S.used[round(S)][ci+'-'+v]) openQ(ci,v); break; }
    case 'adj': S.teams[i][round(S)]+= +b.dataset.d; persist(); render(); break;
    case 'setturn': S.ptr=order(S).indexOf(i); persist(); render(); break;
    case 'inc': if(L&&canInc(L,i)){L.alloc[i]++;persist();renderModal()} break;
    case 'dec': if(L&&L.alloc[i]>0){L.alloc[i]--;persist();renderModal()} break;
    case 'all': if(L){L.alloc=L.alloc.map((_,k)=>k===i?L.v:0);persist();renderModal()} break;
    case 'cancel': S.live=null; persist(); render(); break;
    case 'lock': if(L&&check(L).ok){L.stage='locked';persist();renderModal()} break;
    case 'unlock': if(L){L.stage='place';persist();renderModal()} break;
    case 'reveal': if(L){L.stage='revealed';persist();renderModal()} break;
    case 'commit': if(L) commit(); break;
    case 'ecancel': E=null; render(); break;
    case 'esave': if(E&&!E.busy) saveEdit(); break;
    case 'eimgdel': readEditor(); delete E.img; E.msg=''; renderModal(); break;
    case 'evdel': readEditor(); delete E.vid; E.msg=''; renderModal(); break;
    case 'eadel': readEditor(); delete E.aud; E.msg=''; renderModal(); break;
    case 'edefault': { readEditor(); const d=DEFAULT_Q[E.r][E.ci]; if(d){delete E.img; delete E.vid; delete E.aud; E.link=''; E.note=''; E.expl=''; Object.assign(E,clone(d.qs[E.v]),{name:d.name,icon:d.icon,msg:''}); renderModal()} break; }
    case 'startfinal': if(S.phase!=='qualify') break; S.teams.forEach(t=>t.final=0); S.used.final={}; S.phase='final'; S.ptr=0; persist(); render(); break;
  }
});
document.addEventListener('change',e=>{
  if(ROLE!=='host') return;
  const t=e.target, a=t.dataset.act;
  if(t.id==='e-file'&&t.files&&t.files[0]){onImage(t.files[0]);return}
  if(t.id==='e-vfile'&&t.files&&t.files[0]){onMedia(t.files[0],'vid');return}
  if(t.id==='e-afile'&&t.files&&t.files[0]){onMedia(t.files[0],'aud');return}
  if(a==='rename'){const i=+t.dataset.i; S.teams[i].name=t.value.trim()||S.teams[i].name; persist(); render(); return}
  if(a==='tname'){S.teams[+t.dataset.i].name=t.value.trim()||('Баг '+(+t.dataset.i+1));persist();paintOrder()}
  if(a==='fc'){S.finalCount=+t.value;persist();render()}
  if(a==='pick'){const i=+t.dataset.i; if(t.checked){if(!picks.includes(i))picks.push(i)} else picks=picks.filter(x=>x!==i); render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ROLE==='host'&&E){E=null;render()}});

/* ================= live sync ================= */
async function hostLoad(){
  if(hostLoaded||!DB||!CAN_SYNC) return; hostLoaded=true;
  try{
    const [st,qm,qf]=await Promise.all(['game/state','qs/main','qs/final'].map(p=>DB.doc(p).get()));
    if(st.exists){const d=st.data(); Object.assign(S,{phase:d.phase,teams:d.teams,finalCount:d.phase==='setup'?1:d.finalCount,finalists:d.finalists||[],ptr:d.ptr||0,used:d.used||{main:{},final:{}},live:d.live||null}); S.used.main=S.used.main||{}; S.used.final=S.used.final||{};}
    const ver=d=>d&&d.v===4;
    if(qm.exists&&ver(qm.data())&&qm.data().cats) S.questions.main=qm.data().cats;
    if(qf.exists&&ver(qf.data())&&qf.data().cats) S.questions.final=qf.data().cats;
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    const keys=[]; if(!st.exists) keys.push('state'); if(!(qm.exists&&ver(qm.data()))) keys.push('main'); if(!(qf.exists&&ver(qf.data()))) keys.push('final');
    if(keys.length) persist(...keys);
  }catch(e){syncErr=(e&&e.message)||'Уншиж чадсангүй'}
  render();
}
function playerSubscribe(){
  if(!DB||subs.length) return;
  const on=(p,fn)=>subs.push(DB.doc(p).onSnapshot(s=>{fn(s.exists?s.data():null);render()},()=>{}));
  on('game/state',d=>{REMOTE.state=d&&d.teams?Object.assign({used:{main:{},final:{}},finalists:[],live:null},d):null; if(REMOTE.state){REMOTE.state.used.main=REMOTE.state.used.main||{};REMOTE.state.used.final=REMOTE.state.used.final||{}}});
  on('qs/main',d=>{REMOTE.main=d&&d.cats||null});
  on('qs/final',d=>{REMOTE.final=d&&d.cats||null});
}
function onRole(){
  if(!CAP_DONE) return;
  if(ROLE==='host') hostLoad();
  if(ROLE==='player') playerSubscribe(); else {subs.forEach(u=>{try{u()}catch(e){}}); subs=[]}
}
(async()=>{
  const use=n=>(window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)).catch(()=>null);
  const [user,assets]=await Promise.all([use('user'),use('assets')]);
  ASSETS=assets;
  CAN_SYNC=!!(assets&&user&&await user.canEdit().catch(()=>false));
  CAP_DONE=true; onRole(); render();
})();
render();
